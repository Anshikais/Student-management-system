services:
  # Backend API Web Service on Render
  - type: web
    name: joineazy-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: joineazy-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"

  # Frontend Static Site on Render
  - type: web
    name: joineazy-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: joineazy-backend
          envVarKey: RENDER_EXTERNAL_URL
          transform: "${RENDER_EXTERNAL_URL}/api"

databases:
  # Managed PostgreSQL Database on Render
  - name: joineazy-postgres
    databaseName: joineazy_db
    user: joineazy_user
    plan: free